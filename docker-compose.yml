version: "3.9"

services:
  wiremock:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: merchantos-wiremock

    ports:
      - "8081:8080"

    volumes:
      - ./mappings:/home/wiremock/mappings
      - ./__files:/home/wiremock/__files

    command:
      - "--global-response-templating"
      - "--verbose"

    restart: unless-stopped
